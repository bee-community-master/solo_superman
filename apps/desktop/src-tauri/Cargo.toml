[package]
name = "solo-superman-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "solo_superman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
